name: Check Secrets

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Check keys loaded
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "Gemini key loaded"; else echo "Gemini key missing"; exit 1; fi
          if [ -n "$DEEPSEEK_API_KEY" ]; then echo "DeepSeek key loaded"; else echo "DeepSeek key missing"; exit 1; fi
